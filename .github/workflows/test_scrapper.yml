name: Test New Scraper
on: 
  workflow_dispatch: 

jobs:
  test_run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 icalendar

      - name: Run New Scraper
        run: python zg_event_2.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git pull origin main --rebase
          
          # The '|| true' at the end prevents the 128 error if a file is missing
          git add test_events.csv tvornica_check.csv test_zagreb_gigs.ics test_last_updated.js || true
          
          git commit -m "Test Run: Updated experimental data" || echo "No changes to commit"
          git push origin main
