name: Test New Scraper
on: 
  workflow_dispatch: 

jobs:
  test_run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 icalendar

      - name: Run New Scraper
        run: python zg_event_2.py

      - name: Commit and Push Test Files
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          # We only add the test files here to avoid touching the main ones
          git add test_zagreb_gigs.ics test_events.csv test_last_updated.js
          git commit -m "Test Run: Generated separate test files" || echo "No changes to commit"
          git push
