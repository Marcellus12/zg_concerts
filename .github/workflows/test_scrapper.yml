name: Test New Scraper
on: 
  workflow_dispatch: 

jobs:
  test_run:
    runs-on: ubuntu-latest
    # Granting write permission is essential for the "Push" step
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 icalendar dateparser

      - name: Run New Scraper
        run: python test/zg_event_2.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          
          # Stage the files created by the script
          git add test/test_events.csv test_zagreb_gigs.ics || true
          
          # Check if there are changes, commit if yes, skip if no
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Update events via GitHub Action"
            git push origin main
          else
            echo "No changes to commit"
          fi
