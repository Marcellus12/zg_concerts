name: Test New Scraper
on: 
  workflow_dispatch: # This is the "Manual Run" button

jobs:
  test_run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 icalendar

      - name: Run New Scraper
        run: python zg_event_2.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add zagreb_gigs.ics events.csv last_updated.js
          git commit -m "Test Run: Updated Zagreb events via direct scraper" || echo "No changes to commit"
          git push
