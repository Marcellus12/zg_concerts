name: Zagreb Music Sync

on:
  schedule:
    - cron: '34 11 * * *'
    - cron: '45 22 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Uses the built-in secret for permission

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Scraper
        run: python zg_event.py
      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 1. Pull any changes you made to the code first
          git pull origin main --rebase
          
          # 2. Add the generated files
          git add zagreb_gigs.ics events.csv
          
          # 3. Commit only if there's actually a change in the calendar
          if git diff --staged --quiet; then
            echo "No changes to the calendar data."
          else
            git commit -m "Automated Calendar Update"
            # 4. Push. If there's a conflict, this force-pushes the DATA only
            git push origin main
          fi
