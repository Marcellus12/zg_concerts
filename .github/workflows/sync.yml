name: Zagreb Music Sync

on:
  schedule:
    - cron: '34 11 * * *'
    - cron: '45 22 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Important for pushing the file
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Updated to v4

      - name: Set up Python
        uses: actions/setup-python@v5 # Updated to v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Scraper
        run: python zg_event.py

- name: Commit and Push Calendar
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add zagreb_gigs.ics
          # This checks if there are actually changes to save
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Automated Calendar Update"
            git push origin main
          fi
