name: Zagreb Music Sync

on:
  schedule:
    - cron: '34 11 * * *'
    - cron: '45 22 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 icalendar dateparser

      - name: Run Scraper
        run: python zg_event.py

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Force sync with the remote
          git fetch origin main
          git reset --mixed origin/main
          
          # Add the production files
          git add zagreb_gigs.ics events.csv last_updated.js
          
          if git diff --staged --quiet; then
            echo "No changes to the calendar data."
          else
            git commit -m "Automated Calendar Update"
            # The '--force' ensures the live site updates even if the index changed
            git push origin main --force
          fi
