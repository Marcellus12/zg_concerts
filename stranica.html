<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Events | Zagreb Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { background-color: #0a0a0c; color: #e4e4e7; }
        .glass-card { 
            background: rgba(23, 23, 26, 0.6); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            transition: all 0.3s ease;
        }
        .glass-card:hover { 
            border-color: rgba(99, 102, 241, 0.5);
            transform: translateY(-4px);
            background: rgba(30, 30, 35, 0.8);
        }
        .accent-pill {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(168, 85, 247, 0.2) 100%);
            border: 1px solid rgba(168, 85, 247, 0.3);
        }
    </style>
</head>
<body class="min-h-screen antialiased">

    <nav class="border-b border-white/5 py-4 px-6 sticky top-0 z-50 bg-[#0a0a0c]/80 backdrop-blur-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <a href="index.html" class="font-black tracking-tighter text-xl text-white">ZG<span class="text-indigo-500">.</span>GIGS</a>
            <div class="flex gap-6 text-sm font-medium">
                <a href="index.html" class="text-zinc-400 hover:text-white transition-colors">Calendar</a>
                <a href="stranica.html" class="text-white border-b-2 border-indigo-500 pb-1">Explore Events</a>
            </div>
        </div>
    </nav>

    <header class="max-w-6xl mx-auto px-6 pt-16 pb-8">
        <h1 class="text-4xl md:text-5xl font-extrabold text-white mb-4">Upcoming <span class="text-indigo-500">Events</span></h1>
        <p class="text-zinc-400 max-w-xl">A curated list of what's happening next in Zagreb. Data synced directly from our open-source repository.</p>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-8">
        <div id="event-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="animate-pulse glass-card rounded-3xl h-64"></div>
            <div class="animate-pulse glass-card rounded-3xl h-64 hidden md:block"></div>
            <div class="animate-pulse glass-card rounded-3xl h-64 hidden lg:block"></div>
        </div>
    </main>

    <script>
        const CSV_URL = 'events.csv'; 

        async function loadEvents() {
            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    // Slight delay to appreciate the smooth transition
                    setTimeout(() => displayEvents(results.data), 300);
                },
                error: function() {
                    document.getElementById('event-grid').innerHTML = `
                        <div class="col-span-full text-center py-20 bg-red-500/10 rounded-3xl border border-red-500/20">
                            <p class="text-red-400 font-semibold">Failed to fetch events.csv</p>
                            <p class="text-sm text-zinc-500">Ensure the file is in the root directory.</p>
                        </div>`;
                }
            });
        }
// 1. Updated Color Palette
const TYPE_COLORS = {
    'concert': 'text-indigo-300 bg-indigo-500/20 border-indigo-500/30',
    'festival': 'text-emerald-300 bg-emerald-500/20 border-emerald-500/30',
    'theater': 'text-amber-300 bg-amber-500/20 border-amber-500/30',
    'dj': 'text-sky-300 bg-sky-500/20 border-sky-500/30', // Azure look
    'other': 'text-zinc-300 bg-zinc-500/20 border-zinc-500/30'
};

let allEvents = []; 

async function loadEvents() {
    Papa.parse(CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
            allEvents = results.data;
            displayEvents(allEvents);
        }
    });
}

// 2. Search & Filter Logic
function handleSearch(query) {
    const q = query.toLowerCase();
    const filtered = allEvents.filter(event => 
        (event.artist || "").toLowerCase().includes(q) || 
        (event.venue || "").toLowerCase().includes(q)
    );
    displayEvents(filtered);
}

function filterByType(type) {
    if (type === 'all') {
        displayEvents(allEvents);
    } else {
        const filtered = allEvents.filter(e => (e.type || "").toLowerCase() === type.toLowerCase());
        displayEvents(filtered);
    }
}

function displayEvents(events) {
    const container = document.getElementById('event-grid');
    
    container.innerHTML = events.map(event => {
        const typeKey = (event.type || 'other').toLowerCase();
        const badgeClass = TYPE_COLORS[typeKey] || TYPE_COLORS['other'];
        
        // Fixed Google Maps URL
        const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(event.venue + ' Zagreb')}`;

        return `
            <div class="glass-card rounded-3xl p-6 flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-start mb-4">
                        <span class="px-3 py-1 rounded-full text-[10px] uppercase tracking-widest font-bold border ${badgeClass}">
                            ${event.type || 'Event'}
                        </span>
                        <span class="text-zinc-500 text-xs font-medium">${event.date}</span>
                    </div>
                    <h3 class="text-xl font-bold text-white mb-2 leading-tight">${event.artist}</h3>
                    <p class="text-zinc-400 text-sm line-clamp-2 mb-6 italic">Source: ${event.source}</p>
                </div>
                
                <div class="flex items-center justify-between mt-4 pt-4 border-t border-white/5">
                    <a href="${mapUrl}" target="_blank" class="flex items-center text-zinc-300 text-sm hover:text-indigo-400 transition-colors group">
                        <svg class="w-4 h-4 mr-2 text-indigo-500 group-hover:scale-125 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                            <path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                        <span class="border-b border-transparent group-hover:border-indigo-500">${event.venue}</span>
                    </a>
                    
                    <a href="${event.link}" target="_blank" class="text-white hover:bg-indigo-500/20 p-2 rounded-full transition-all">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                        </svg>
                    </a>
                </div>
            </div>`;
    }).join('');
}
        
        window.onload = loadEvents;
    </script>
</body>
</html>
